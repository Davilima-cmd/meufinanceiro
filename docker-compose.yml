version: "3.8"

services:
  db:
    image: postgres:17-alpine
    container_name: meufinanceiro-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: caju13032306-
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - meufinanceiro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  meufinanceiro_pgdata:
