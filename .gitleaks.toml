# Allowlist global: documentação, exemplos de ambiente, testes (que usam
# tokens fictícios de propósito) e artefatos de build/dependências.
#
# Formato `[[allowlists]]` (gitleaks >= 8.19). O `[allowlist]` singular antigo
# é aceito com aviso, mas pode falhar dependendo da versão: usar a forma nova
# evita que o job de secret scanning quebre por configuração.
[[allowlists]]
description = "Documentação, exemplos e testes com valores fictícios"
paths = [
  '''(?i)\.example$''',
  '''(?i)\.md$''',
  '''(?i)^docs/''',
  '''(?i)\.test\.tsx?$''',
  '''(?i)\.spec\.tsx?$''',
  '''(?i)(^|/)node_modules/''',
  '''(?i)(^|/)\.next/''',
  '''(?i)(^|/)dist/''',
  '''(?i)(^|/)coverage/''',
  '''(?i)pnpm-lock\.yaml$''',
]

# Valores que são variáveis de ambiente ou placeholders óbvios não são
# segredos: os scripts de operação montam a URL com `${PASS}`, `${ROLE}` etc.
[[allowlists]]
description = "Placeholders de variável de ambiente e credenciais de exemplo"
regexes = [
  '''\$\{[A-Za-z_][A-Za-z0-9_]*\}''',
  '''(?i)(senha|password|usuario|username|example|exemplo|placeholder)''',
  '''(?i)localhost''',
]

[[rules]]
id = "generic-api-key"
description = "Generic API Key pattern"
regex = '''(?i)(api[_-]?key|apikey)\s*[:=]\s*["'][a-zA-Z0-9_\-]{20,}["']'''
tags = ["key", "api"]
entropy = 3.5

[[rules]]
id = "generic-secret"
description = "Generic Secret pattern"
regex = '''(?i)(secret|password|pwd)\s*[:=]\s*["'][^"']{8,}["']'''
tags = ["secret", "password"]
entropy = 3.0

[[rules]]
id = "jwt-token"
description = "JWT Token pattern"
regex = '''eyJ[a-zA-Z0-9_-]*\.eyJ[a-zA-Z0-9_-]*\.[a-zA-Z0-9_-]*'''
tags = ["jwt", "token"]

[[rules]]
id = "postgres-connection"
description = "PostgreSQL Connection String"
regex = '''postgresql://[^:]+:[^@]+@[^/]+/\w+'''
tags = ["database", "postgres"]

[[rules]]
id = "private-key"
description = "Private Key pattern"
regex = '''-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''
tags = ["key", "private"]