name: CI

on:
  push:
    # `main` mais as branches de trabalho (`arena/**`): antes, push numa branch
    # de trabalho não rodava nada e o erro só aparecia na hora do merge.
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Gera o cliente Prisma tipado (sem binários de engine: o typecheck não
      # executa consultas). O build da API também roda o generate.
      - run: pnpm --filter @meufinanceiro/api exec prisma generate --no-engine
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo: o Gitleaks precisa ver commits antigos, não só o
          # diff do push.
          fetch-depth: 0
      - name: Run Gitleaks
        # Imagem oficial do Gitleaks com `--redact`: o log público do CI não
        # pode ser o lugar onde um segredo vaza.
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.28.0 \
            detect --source=/repo --config=/repo/.gitleaks.toml \
            --report-path=/repo/gitleaks-report.json --report-format=json \
            --redact --verbose
